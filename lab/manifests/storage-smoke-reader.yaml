apiVersion: v1
kind: Pod
metadata:
  name: storage-smoke-reader
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: docker.io/library/busybox:1.36.1@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - test "$(cat /data/proof.txt)" = fresh-storage-proof
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-smoke
