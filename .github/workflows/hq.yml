# RUNNER-HQ (lab/runner/): HQ built from zero on a GitHub-hosted runner by lab/build.sh, with its Salt doors (4505,
# 4506) and SSH on a public TCP relay that needs no account (bore.pub). No web port is ever relayed: the Web UI is an
# SSH tunnel. Start it from the GitHub app (Actions > hq > Run workflow) or from a terminal:
#   gh workflow run hq.yml -R AkashKumar7902/zero-to-uyuni -f hours=5 -f game=off
# The SSH door is in the job summary within ~3 min; the Salt doors and server.env when the build is done (~20-40 min).
# Stop early (the logs are still uploaded): ssh -p <SSH_PORT> root@bore.pub touch /root/osas26/runner/STOP
# Secrets (all optional): GEEKO_HQ_DEPLOY_KEY (read-only deploy key of geeko-hq, for the golden hooks) and
# GOLDEN_TOKEN (game=on only). Nothing secret is ever echoed; the artifacts are checked for secret values.
name: hq
on:
  workflow_dispatch:
    inputs:
      hours: {description: "hours HQ stays up after the build (0.25-5.5; the job itself ends at 6 h)", default: "5", required: true}
      relay:
        description: "relay: bore.pub gives exactly 4505/4506 (what the kit needs) or waits for them; bore.pub-any takes any free ports (needs the D-K2 kit)"
        type: choice
        options: [bore.pub, bore.pub-any]
        default: bore.pub
      game:
        description: "game hooks: off = installed with GAME_OFF=1; on = live posts (needs GOLDEN_TOKEN)"
        type: choice
        options: ["off", "on"]
        default: "off"
      room: {description: "where golden posts: auto (live room; forwards to the console's GOLDEN target outside the show) or reh-MMDD-n", default: auto, required: true}
      accept_min: {description: "start the attendee accept loop now for N minutes (0 = only the Oct 3 15:55 WIB timer)", default: "0", required: true}
      cap: {description: "CAP: max accepted attendee keys (also the fleet key's usage limit)", default: "60", required: true}
      publish: {description: "commit attendee/server.env to main when HQ is up (the file every sandbox fetches)", type: boolean, default: false}
permissions:
  contents: write     # only the optional publish step pushes (attendee/server.env)
concurrency: {group: hq, cancel-in-progress: false}
jobs:
  hq:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      HAS_HOOKS_KEY: ${{ secrets.GEEKO_HQ_DEPLOY_KEY != '' }}
    steps:
      - name: inputs
        env: {HOURS: "${{ inputs.hours }}", ROOM: "${{ inputs.room }}", AMIN: "${{ inputs.accept_min }}", CAP: "${{ inputs.cap }}"}
        run: |
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          awk -v h="$HOURS" 'BEGIN{exit !(h+0 >= 0.25 && h+0 <= 5.5)}' || { echo "::error::hours must be 0.25-5.5"; exit 1; }
          [[ $ROOM == auto || $ROOM =~ ^reh-[0-9]{4}-[0-9]+$ ]] || { echo "::error::room must be auto or reh-MMDD-n"; exit 1; }
          [[ $AMIN =~ ^[0-9]+$ && $CAP =~ ^[0-9]+$ && $CAP -ge 1 && $CAP -le 99 ]] || { echo "::error::accept_min and cap are numbers (cap 1-99)"; exit 1; }
      - uses: actions/checkout@v4
      - name: prepare the runner (facts, disk, Docker off, sshd key-only, the osas26 key)
        run: |
          sudo bash lab/runner/prep.sh "$GITHUB_WORKSPACE"
          sudo systemd-run -q --unit=osas26-sampler /bin/bash /root/zero-to-uyuni/lab/runner/sample.sh 10
      - name: relay - the SSH door (bore v0.6.0, checksum-pinned)
        env: {RELAY: "${{ inputs.relay }}"}
        run: |
          sudo install -d -m 0755 /etc/osas26
          printf 'RELAY_SERVER=bore.pub\nSALT_FIXED=%s\nSSH_WANT=0\nPORT_HOLD=600\nFALLBACK=0\nNODE_IP=%s\n' \
            "$([ "$RELAY" = bore.pub ] && echo 1 || echo 0)" "$(ip -o -4 route get 1.1.1.1 | sed -n 's/.* src \([^ ]*\).*/\1/p')" \
            | sudo tee /etc/osas26/relay.conf
          sudo bash /root/zero-to-uyuni/lab/runner/relay.sh install
          sudo bash /root/zero-to-uyuni/lab/runner/relay.sh up ssh
          . <(sudo cat /root/osas26/relay.env)
          { echo "### RUNNER-HQ: the SSH door (key-only, the osas26 key)"
            echo '```'
            echo "ssh -i ~/.ssh/osas26_ed25519 -p $SSH_PORT root@$RELAY_SERVER      # host key $SSH_HOSTKEY"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: build HQ from zero (lab/build.sh, RUNNER=1)
        timeout-minutes: 150
        env: {CAP: "${{ inputs.cap }}"}
        run: sudo env RUNNER=1 KEY_LIMIT="$CAP" bash /root/zero-to-uyuni/lab/build.sh 2>&1 | sudo tee /root/osas26/build.log
      - name: relay - the Salt doors (4505, 4506) and server.env
        run: |
          sudo bash /root/zero-to-uyuni/lab/runner/relay.sh up salt || echo "::warning::Salt doors not as wanted (see relay status)"
          sudo bash /root/zero-to-uyuni/lab/runner/relay.sh status
          mkdir -p out && sudo bash /root/zero-to-uyuni/lab/runner/server-env.sh > out/server.env || echo "::error::server.env not written"
          sudo bash /root/zero-to-uyuni/lab/runner/e2e.sh pubport || true
          . <(sudo cat /root/osas26/relay.env)
          { echo "### RUNNER-HQ: HQ is up"
            echo "Salt doors: \`$RELAY_SERVER:$SALT_PUB_PORT\` (publish), \`$RELAY_SERVER:$SALT_REQ_PORT\` (request), relay IPv4 $RELAY_IP"
            echo "SSH: \`ssh -i ~/.ssh/osas26_ed25519 -p $SSH_PORT root@$RELAY_SERVER\` (host key $SSH_HOSTKEY)"
            echo "Web UI: \`ssh -i ~/.ssh/osas26_ed25519 -p $SSH_PORT -N -L 127.0.0.1:18443:$NODE_IP:443 root@$RELAY_SERVER\`, then https://$(sudo sed -n 's/^FQDN=//p' /root/osas26/lab.env):18443/ with the name mapped to 127.0.0.1"
            echo; echo "server.env (the artifact **server-env**):"; echo '```'; cat out/server.env; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: server-env, path: out/server.env, retention-days: 3}
      - name: geeko-hq's golden hooks (sparse checkout)
        if: env.HAS_HOOKS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: AkashKumar7902/geeko-hq
          ssh-key: ${{ secrets.GEEKO_HQ_DEPLOY_KEY }}
          path: geeko-hq
          sparse-checkout: |
            golden-hooks
            src/lib
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.HAS_HOOKS_KEY == 'true'
        with: {node-version: "22"}
      - name: install the hooks (GAME_OFF=1 unless game=on)
        if: env.HAS_HOOKS_KEY == 'true'
        env: {GAME: "${{ inputs.game }}", ROOM: "${{ inputs.room }}", GOLDEN_TOKEN: "${{ secrets.GOLDEN_TOKEN }}"}
        run: |
          node geeko-hq/golden-hooks/make-deny-env.mjs > geeko-hq/golden-hooks/deny.env
          sudo --preserve-env=GOLDEN_TOKEN bash lab/runner/hooks.sh "$GITHUB_WORKSPACE/geeko-hq/golden-hooks" "$GAME" "$ROOM"
          rm -rf geeko-hq
      - name: no hooks key
        if: env.HAS_HOOKS_KEY != 'true'
        run: echo "::notice::GEEKO_HQ_DEPLOY_KEY is not set, so the golden hooks are not installed (the lab works without the game)"
      - name: accept loop now (optional)
        if: inputs.accept_min != '0'
        env: {AMIN: "${{ inputs.accept_min }}", CAP: "${{ inputs.cap }}"}
        run: sudo bash /root/zero-to-uyuni/lab/runner/e2e.sh accept "$AMIN" "$CAP"
      - name: publish attendee/server.env (optional)
        if: inputs.publish
        run: |
          git config user.name "zero-to-uyuni hq.yml"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main && git checkout -q -B main origin/main
          cp out/server.env attendee/server.env && cp out/server.env zero-to-uyuni/assets/server.env
          bash lab/lint-server-env.sh attendee/server.env
          git add attendee/server.env zero-to-uyuni/assets/server.env
          git commit -q -m "server.env: RUNNER-HQ run ${{ github.run_id }} (relay $(sed -n 's/^RELAY=//p' out/server.env))" && git push -q origin main
          echo "published: https://raw.githubusercontent.com/${{ github.repository }}/main/attendee/server.env" >> "$GITHUB_STEP_SUMMARY"
      - name: check.sh
        run: sudo bash /root/zero-to-uyuni/lab/check.sh 2>&1 | sudo tee /root/osas26/check.txt || true
      - name: keep HQ up (heartbeat every minute)
        env: {HOURS: "${{ inputs.hours }}"}
        run: |
          left=$(( 350 - ($(date +%s) - JOB_T0) / 60 - 6 ))
          want=$(awk -v h="$HOURS" 'BEGIN{printf "%d", h * 60}')
          min=$(( want < left ? want : left )); [ "$min" -gt 0 ] || min=1
          [ "$min" -lt "$want" ] && echo "::warning::capped at $min min by the 6-h job limit"
          sudo bash /root/zero-to-uyuni/lab/runner/heartbeat.sh "$min"
      - name: hold for debugging after a failure (SSH stays open; STOP file ends it)
        if: failure()
        run: sudo bash /root/zero-to-uyuni/lab/runner/heartbeat.sh 45 || true
      - name: collect logs and timings (no secrets)
        if: always()
        run: sudo bash lab/runner/collect.sh "$GITHUB_WORKSPACE/evidence" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: hq-evidence, path: evidence, retention-days: 14, if-no-files-found: warn}
